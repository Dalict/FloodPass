<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FD26E"/>
      <stop offset="1" stop-color="#129447"/>
    </linearGradient>
    <pattern id="bricks" width="360" height="320" patternUnits="userSpaceOnUse">
      <g stroke="#000000" stroke-opacity="0.235" stroke-width="12" fill="none">
        <path d="M -6 0 H 366 M -6 160 H 366 M -6 320 H 366"/>
        <path d="M 180 -6 V 160 M -6 160 V 320 M 366 160 V 320"/>
      </g>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="85"/>
    </filter>
    <mask id="texFade">
      <ellipse cx="512" cy="512" rx="300" ry="300" fill="#ffffff" filter="url(#soft)"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="205" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="205" fill="url(#bricks)" mask="url(#texFade)"/>
  <text x="512" y="217.3" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="118" letter-spacing="46" fill="#FFFFFF"
        text-anchor="middle">AUTO</text>
  <text x="512" y="905.9" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="74" letter-spacing="16" fill="#FFFFFF"
        text-anchor="middle">FLOODGATE</text>
  <circle cx="512" cy="468" r="152" fill="#FFFFFF"/>
  <polygon points="446 560 578 560 634 800 390 800" fill="#FFFFFF"/>
</svg>
